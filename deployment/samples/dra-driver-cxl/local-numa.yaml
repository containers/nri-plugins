# 128Mi of a CXL memory device attached to the node, as RAM of the
# device's NUMA node (DeviceClass cxl-local of
# ../../helm/dra-driver-cxl/templates/deviceclasses.yaml). The
# container has that node in its cpuset.mems; it is not steered (no
# container.steering, see region-dram-policy.yaml): the kernel allocates
# its memory near its CPUs first, and numactl or mbind bind it to the
# node. It prints its CXL_* environment (CXL_<KEY>_NUMA_NODE is the node) and
# cpuset.mems.
# A selector picks a specific device:
#   device.attributes["cxl.nri.io"].serial == "0xc100e2e1"
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: local-numa
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-local
        capacity:
          requests:
            memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-numa
spec:
  resourceClaims:
  - name: mem
    resourceClaimName: local-numa
  containers:
  - name: app
    image: docker.io/library/python:3-alpine
    command: ["sh", "-c", "env | grep ^CXL_ | sort; echo cpuset.mems: $(cat /sys/fs/cgroup/cpuset.mems.effective); sleep infinity"]
    resources:
      claims:
      - name: mem
