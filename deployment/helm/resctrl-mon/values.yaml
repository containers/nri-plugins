# Default values for resctrl-mon.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
---
resctrlPath: /sys/fs/resctrl

# Telemetry configuration — embedded OTel exporter.
telemetry:
  prometheus:
    enabled: true
    listenAddress: ":9100"
    scrapeInterval: "15s"    # recommended scrape interval (annotation hint)
    # OTel Prometheus namespace: prefixes every metric name with "<namespace>_".
    # Leave empty. The bundled Grafana dashboards query the unprefixed names
    # (l3_*/perf_*); a non-empty value renames every series and breaks them.
    namespace: ""
  otlp:
    enabled: false
    endpoint: ""             # e.g. "otel-collector-resctrl.monitoring.svc:4317"
    protocol: grpc           # grpc | http
    interval: 15s
    insecure: true
  perfCounters:
    enabled: false           # gate rdt=perf counters (c1_res, stalls_*, etc.)
    include: []
    exclude: []
  resourceAttributes: {}     # static OTel resource attributes

image:
  name: ghcr.io/containers/nri-plugins/nri-resctrl-mon
  # tag, if defined will use the given image tag, otherwise Chart.AppVersion will be used
  #tag: unstable
  pullPolicy: Always

resources:
  cpu: 10m
  memory: 50Mi

nri:
  plugin:
    index: 90
  runtime:
    patchConfig: false
#   config:
#     pluginRegistrationTimeout: 5s
#     pluginRequestTimeout: 2s

initContainerImage:
  name: ghcr.io/containers/nri-plugins/nri-config-manager
  # If not defined Chart.AppVersion will be used
  #tag: unstable
  pullPolicy: Always

tolerations: []
#
# Example:
#
# tolerations:
# - key: "node-role.kubernetes.io/control-plane"
#   operator: "Exists"
#   effect: "NoSchedule"

affinity: []
#
# Example:
#
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: feature.node.kubernetes.io/cpu-rdt.mon
#           operator: In
#           values:
#           - "true"

nodeSelector: []
#
# Example:
#
# nodeSelector:
#  feature.node.kubernetes.io/cpu-rdt.mon: "true"

# NRI plugins should be considered as part of the container runtime.
# By default we make them part of the system-node-critical priority
# class. This should mitigate the potential risk of a plugin getting
# evicted under heavy system load. It should also ensure that during
# autoscaling enough new nodes are brought up to leave room for the
# plugin on each new node.
podPriorityClassNodeCritical: true
