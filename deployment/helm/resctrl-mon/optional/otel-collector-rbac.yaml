# RBAC for the OTel Collector k8sattributes processor.
# Grants read access to pod metadata so the processor can enrich metrics.
---
# The reference manifests deploy into the monitoring namespace. Create it here
# so a clean cluster can `kubectl apply` these files without a prior step;
# apply is idempotent if the namespace already exists.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-resctrl
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-resctrl
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-resctrl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-resctrl
subjects:
  - kind: ServiceAccount
    name: otel-collector-resctrl
    namespace: monitoring
