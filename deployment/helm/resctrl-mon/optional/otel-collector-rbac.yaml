# RBAC for the OTel Collector k8sattributes processor.
# Grants read access to pod metadata so the processor can enrich metrics.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-resctrl
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-resctrl
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-resctrl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-resctrl
subjects:
  - kind: ServiceAccount
    name: otel-collector-resctrl
    namespace: monitoring
