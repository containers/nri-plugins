config:
  agent:
    nodeResourceTopology: true
    podResourceAPI: true
  allocatorTopologyBalancing: false
  availableResources:
    cpu: cpuset:0-7,9-14
  reservedResources:
    cpu: cpuset:0

  pinCPU: true
  pinMemory: false

  balloonTypes:
  - name: hp-near-tpu
    cpuClass: pct-hp
    preferCloseToDevices:
    - podresourceapi:tech.com/*
    preferNewBalloons: true
    preferSpreadingPods: true

  - name: near-nic
    preferCloseToDevices:
    - podresourceapi:*.com/nic
    preferNewBalloons: true
    preferSpreadingPods: true
    shareIdleCPUsInSame: package

  cpuClasses:
  - name: pct-hp
    minFreq: "turbo"
    maxFreq: "turbo"
    pctPriority: high
    publishExtendedResource: true

  - name: default
    minFreq: "min"
    maxFreq: "base"
    pctPriority: low

  log:
    debug:
      - policy
      - nri-plugin
      - cpu
      - cpuclass
extraEnv:
  OVERRIDE_SYS_CPUFREQ: '''[{"cpus": "0-15", "base": 2900000, "min": 800000, "max": 3800000}]'''
  OVERRIDE_SST: '''{"supported": true, "clos_count": 4, "packages": [{"id": 0, "cpus": "0-7", "tf_supported": true, "cp_supported": true, "max_hp_cpus": 4}, {"id": 1, "cpus": "8-15", "tf_supported": true, "cp_supported": true, "max_hp_cpus": 4}]}'''
  OVERRIDE_SST_STATE_DIR: "/tmp/nri-pct-mock"
