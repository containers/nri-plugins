config:
  dra:
    enabled: true
  availableResources:
    cpu: cpuset:1-15
  reservedResources:
    cpu: "1"
  pinCPU: true
  pinMemory: true
  balloonTypes:
    - name: fast
      minBalloons: 2
      maxBalloons: 2
      minCPUs: 1
      maxCPUs: 4
      allocatorPriority: high
      dra:
        deviceName: "fast-${instance}"
    - name: solo
      minBalloons: 1
      maxBalloons: 1
      minCPUs: 2
      maxCPUs: 2
      dra: {}
    - name: lazy
      minBalloons: 1
      maxBalloons: 1
      maxCPUs: 2
      dra:
        nodeAllocatable: false
    - name: two-cpu
      minCPUs: 2
      maxCPUs: 2
      preferNewBalloons: true
  instrumentation:
    httpEndpoint: ":8891"
  log:
    debug:
      - policy
      - dra
      - resource-manager
    source: true
    klog:
      skip_headers: true
