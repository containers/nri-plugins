config:
  reservedResources:
    cpu: 1000m
  pinCPU: true
  pinMemory: true
  controllableInterrupts: [ "*rtc0*" ]
  balloonTypes:
    - name: claimer
      minCPUs: 2
      maxCPUs: 2
      irqClaim:
        - "*ttyS0*"
        - "*rtc0*"
  log:
    debug:
      - policy
      - irq
    klog:
      skip_headers: true
