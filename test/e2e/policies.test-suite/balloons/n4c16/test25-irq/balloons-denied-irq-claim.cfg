config:
  reservedResources:
    cpu: 1000m
  pinCPU: true
  pinMemory: true
  # Only acpi interrupts are controllable, yet the claimer balloon type
  # below claims ttyS0. The configuration must be rejected.
  controllableInterrupts:
    - "*acpi*"
  balloonTypes:
    - name: claimer
      minCPUs: 2
      maxCPUs: 2
      irqClaim:
        - "*ttyS0*"
  log:
    debug:
      - policy
      - irq
    klog:
      skip_headers: true
