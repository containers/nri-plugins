config:
  reservedResources:
    cpu: 1000m
  pinCPU: true
  pinMemory: true
  balloonTypes:
    - name: dedicated-claimer
      minCPUs: 2
      maxCPUs: 2
      irqClaim:
        - "ttyS" # should not match
        - "*rtc0*"
      irqMode: isolate
  log:
    debug:
      - policy
    klog:
      skip_headers: true
