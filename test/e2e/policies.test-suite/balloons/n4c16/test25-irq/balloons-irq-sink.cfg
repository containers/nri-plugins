config:
  reservedResources:
    cpu: 1000m
  pinCPU: true
  pinMemory: true
  balloonTypes:
    - name: claimer
      minCPUs: 2
      maxCPUs: 2
      irqClaim:
        - "*ttyS0*"
        - "*rtc0*"
    - name: sink
      minCPUs: 2
      maxCPUs: 2
      irqMode: sink
  log:
    debug:
      - policy
    klog:
      skip_headers: true
