---
- name: check need and availability of a custom kernel
  ansible.builtin.import_playbook: custom-kernel.yaml

- hosts: all
  become: true
  vars:
    plugin_name: blockio
    test_image: "localhost/{{ plugin_name }}:testing"
  tasks:
    - name: require CRI-O for the blockio comparison suite
      ansible.builtin.assert:
        that: cri_runtime == 'crio'
        fail_msg: Run io.test-suite with k8scri=crio

    - name: install blockio comparison dependencies
      ansible.builtin.package:
        name:
          - crun
          - jq
        state: present

    - name: copy the blockio plugin binary
      ansible.builtin.copy:
        src: "{{ nri_resource_policy_src }}/build/bin/nri-blockio"
        dest: /usr/local/bin/nri-blockio
        mode: '0755'

    - name: copy helm charts
      become: false
      synchronize:
        src: "{{ nri_resource_policy_src }}/deployment/helm/{{ plugin_name }}"
        dest: "./helm"
        use_ssh_args: true

    - name: get latest nri-blockio deployment image name
      become: false
      delegate_to: localhost
      shell: "ls -1t {{ nri_resource_policy_src }}/build/images/nri-{{ plugin_name }}-image-*.tar"
      register: nri_plugin_images
      failed_when: nri_plugin_images.rc != 0

    - name: copy latest nri-blockio deployment image
      become: false
      synchronize:
        src: "{{ nri_plugin_images.stdout_lines[0] }}"
        dest: "."
        use_ssh_args: true

    - name: load nri plugin image when using cri-o
      become: false
      shell: |
        set -e
        loaded_ref=$(sudo podman image load -i "{{ nri_plugin_images.stdout_lines[0] | basename }}" |
                         sed -n 's/^Loaded image[^:]*: *//p' | tr ',' '\n' | head -n 1)
        if [ -z "$loaded_ref" ]; then
            echo "failed to resolve the reference of the loaded image" >&2
            exit 1
        fi
        sudo podman image tag "$loaded_ref" {{ test_image }}
      when: cri_runtime == 'crio'
