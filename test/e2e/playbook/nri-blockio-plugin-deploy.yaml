---
- name: check need and availability of a custom kernel
  ansible.builtin.import_playbook: custom-kernel.yaml

- hosts: all
  become: no
  become_user: root
  vars:
    cri_runtime: "{{ cri_runtime }}"
    is_containerd: false
    is_crio: false
    plugin_name: "blockio"
    test_image: "localhost/{{ plugin_name }}:testing"
  tasks:
    - set_fact:
        is_containerd: true
      when: cri_runtime == "containerd"
    - set_fact:
        is_crio: true
      when: cri_runtime == "crio"

    - name: prepare containerd for the blockio tests
      become: yes
      when: is_containerd
      block:
        - name: configure containerd to let NRI handle blockio classes
          ansible.builtin.copy:
            dest: /etc/containerd/conf.d/nri-blockio.toml
            mode: '0644'
            content: |
              version = 4

              [plugins."io.containerd.service.v1.tasks-service"]
                blockio_config_file = ""

              [plugins."io.containerd.cri.v1.runtime".containerd]
                ignore_blockio_not_enabled_errors = true
          register: blockio_containerd_configured

        - name: restart containerd after blockio configuration changes
          ansible.builtin.systemd:
            name: containerd
            state: restarted
          when: blockio_containerd_configured.changed

    - name: copy helm charts
      synchronize:
        src: "{{ nri_resource_policy_src }}/deployment/helm/{{ plugin_name }}"
        dest: "./helm"
        use_ssh_args: true

    - name: get latest nri-blockio deployment image name
      delegate_to: localhost
      shell: "ls -1t {{ nri_resource_policy_src }}/build/images/nri-{{ plugin_name }}-image-*.tar"
      register: nri_plugin_images
      failed_when: nri_plugin_images.rc != 0

    - name: copy latest nri-blockio deployment image
      synchronize:
        src: "{{ nri_plugin_images.stdout_lines[0] }}"
        dest: "."
        use_ssh_args: true

    - name: import nri plugin image when using containerd
      become: yes
      ansible.builtin.command: >-
        ctr -n k8s.io images import --index-name {{ test_image }}
        "{{ nri_plugin_images.stdout_lines[0] | basename }}"
      when: is_containerd

    - name: load nri plugin image when using cri-o
      become: yes
      shell: |
        set -e
        loaded_ref=$(sudo podman image load -i "{{ nri_plugin_images.stdout_lines[0] | basename }}" |
                         sed -n 's/^Loaded image[^:]*: *//p' | tr ',' '\n' | head -n 1)
        if [ -z "$loaded_ref" ]; then
            echo "failed to resolve the reference of the loaded image" >&2
            exit 1
        fi
        sudo podman image tag "$loaded_ref" {{ test_image }}
      when: is_crio
