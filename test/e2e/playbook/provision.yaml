---
- name: Provision VM, set up single-node Kubernetes cluster
  hosts: all
  become: true
  become_user: root
  vars:
    cri_runtime: "{{ cri_runtime }}"
    k8s_release: "{{ k8s_release }}"
    k8s_version: "{{ k8s_version }}"
    # Comma-separated "Gate1=true,Gate2=false" list, or empty.
    k8s_feature_gates: "{{ k8s_feature_gates }}"
    is_containerd: false
    is_crio: false
    is_hardware: false
    containerd_release: "{{ containerd_release }}"
    containerd_tarball: "https://github.com/containerd/containerd/releases/download/v{{ containerd_release }}/containerd-{{ containerd_release }}-linux-amd64.tar.gz"
    containerd_service_file: "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
    crio_release: "{{ crio_release }}"
    crio_tarball: "https://storage.googleapis.com/cri-o/artifacts/cri-o.amd64.v{{ crio_release }}.tar.gz"
    helm_release: "{{ helm_release }}"
    helm_tarball: "https://get.helm.sh/helm-v{{ helm_release }}-linux-amd64.tar.gz"
    dns_nameserver: "{{ dns_nameserver }}"
    cni_plugin: "{{ cni_plugin }}"
    cni_release: "{{ cni_release }}"
    cilium_tarball: ""
    cache_dir: "{{ cache_dir }}"
    cached_runtime_tarball: ""
    remote_runtime_tarball: ""
    cri_socket: ""
    cached_helm_tarball: "{{ cache_dir }}/{{ helm_tarball | basename }}"
    # How old an apt package index may be before it is refreshed. dnf needs
    # no such setting: it expires its own metadata, per repository, and a
    # rerun of this playbook only has to stop forcing a refresh.
    apt_cache_valid_time: 3600

  tasks:
    # Before the reset and the installs below, while the host is still as we
    # found it: a host which cannot run the tests is refused rather than left
    # with its cluster taken down and the packages of the next one in place.
    #
    # The kernel's own answer, not ansible_facts.selinux. That fact needs the
    # SELinux python bindings on the host, and without them it reads
    # "Missing selinux Python library", which no comparison against "enabled"
    # can tell apart from a host that has SELinux switched off. The file
    # below exists only while SELinux is active, and holds 1 while it is
    # enforcing, whatever is installed for python.
    - name: Look for SELinux on a host we were given
      ansible.builtin.stat:
        path: /sys/fs/selinux/enforce
      register: selinux_enforce_file
      when: is_hardware

    - name: Ask it whether SELinux is enforcing
      ansible.builtin.slurp:
        src: /sys/fs/selinux/enforce
      register: selinux_enforce
      when: is_hardware and
            (selinux_enforce_file.stat.exists | default(false))

    - name: Refuse to run with SELinux enforcing
      ansible.builtin.fail:
        msg: >-
          SELinux is enforcing on this host. The tests need it permissive or
          disabled, and turning it off is not something this playbook will do
          to a host which is not its own: run "setenforce 0" for this boot, or
          set SELINUX=permissive in /etc/selinux/config and reboot.
      when: is_hardware and
            (selinux_enforce_file.stat.exists | default(false)) and
            (selinux_enforce.content | default('') | b64decode | trim) == '1'

    - name: Check if runtime is containerd
      ansible.builtin.set_fact:
        is_containerd: true
        cached_runtime_tarball: "{{ cache_dir }}/{{ containerd_tarball | basename }}"
        remote_runtime_tarball: "{{ containerd_tarball }}"
        cri_socket: unix:///var/run/containerd/containerd.sock
      when: cri_runtime == "containerd"
    - name: Check if runtime is CRI-O
      ansible.builtin.set_fact:
        is_crio: true
        cached_runtime_tarball: "{{ cache_dir }}/{{ crio_tarball | basename }}"
        remote_runtime_tarball: "{{ crio_tarball }}"
        cri_socket: unix:///var/run/crio/crio.sock
      when: cri_runtime == "crio"

    # Where to put a kubeconfig the user who logs in can read. This play runs
    # with become, so the facts describe root: ansible_env.HOME,
    # ansible_user_dir and ansible_user_id all say root, and only
    # ansible_user is the account we connected as. So look its home up
    # rather than deriving it from a fact or assuming /home/<user>.
    - name: Read the passwd entry of the login user
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    # Captured into facts here, and only used as facts below. ansible-core
    # 2.20 templates loop items without the connection magic variables, so
    # ansible_user is undefined inside a with_items although it resolves in
    # an ordinary task, and a with_items which referenced it failed with
    # "'ansible_user' is undefined" a hundred tasks into a run.
    - name: Note the login user and its home directory
      ansible.builtin.set_fact:
        login_user: "{{ ansible_user }}"
        login_user_home: "{{ ansible_facts.getent_passwd[ansible_user][4] }}"

    # kubeadm init refuses to run a second time, so a rerun which means to
    # rebuild the cluster has to take the old one down first. This happens
    # here, before the tasks which write the CNI configuration and the
    # kubeconfigs: kubeadm reset leaves both behind, so a provisioning run
    # which stopped before writing them would otherwise leave a stale one
    # pointing at a cluster which no longer exists.
    #
    # admin.conf names a control plane node and kubelet.conf a node which
    # joined a cluster somebody else runs. kubeadm init refuses to run over
    # either, so both are something to reset.
    - name: Check for a cluster to reset
      ansible.builtin.find:
        paths: /etc/kubernetes
        patterns:
          - admin.conf
          - kubelet.conf
      register: existing_cluster

    - name: Reset the existing Kubernetes cluster
      when: (kubeadm_reset | default(false) | bool) and existing_cluster.matched > 0
      block:
        # The endpoint the cluster on the host runs on, which is not the one
        # this run asked for when the runtime is being switched. kubeadm
        # recorded it in kubelet's arguments when it created the cluster.
        - name: Read the runtime endpoint of the existing cluster
          ansible.builtin.command:
            cmd: sed -n 's/.*--container-runtime-endpoint=\([^ "]*\).*/\1/p' /var/lib/kubelet/kubeadm-flags.env
          register: existing_endpoint
          changed_when: false
          failed_when: false

        # Reset talks to the runtime holding the control plane containers.
        # Told the wrong one it removes nothing, and they keep the ports the
        # replacement cluster needs. The requested socket is the fallback,
        # and what kubeadm init below is given.
        - name: Tear the cluster down with kubeadm reset
          ansible.builtin.command:
            cmd: >-
              kubeadm reset --force --cri-socket
              {{ (existing_endpoint.stdout | default('') | trim) or cri_socket }}

        - name: Remove the CNI configuration of the old cluster
          ansible.builtin.file:
            path: /etc/cni/net.d
            state: absent

        - name: Recreate the CNI configuration directory
          ansible.builtin.file:
            path: /etc/cni/net.d
            state: directory
            mode: '0755'

        # Moved, not deleted: on a host somebody owns this file is theirs,
        # and it can hold credentials and contexts for clusters which have
        # nothing to do with this run. Numbered, so that a second run lands
        # beside the backup the first one left rather than on top of it. The
        # home directory is quoted for a passwd home with a space in it.
        - name: Move the kubeconfigs of the old cluster aside
          ansible.builtin.command:
            cmd: mv --backup=numbered "{{ item }}" "{{ item }}~"
            removes: "{{ item }}"
          with_items:
            - /root/.kube/config
            - "{{ login_user_home }}/.kube/config"

    - name: Setup DNS
      ansible.builtin.shell: "{{ item }}"
      with_items:
        - rm -f /etc/resolv.conf
        - echo "nameserver {{ dns_nameserver }}" > /etc/resolv.conf
        - echo "search  {{ dns_search_domain }}" >> /etc/resolv.conf
        - sed -i "s/DNS=.*$/DNS={{ dns_nameserver }}/" /etc/systemd/resolved.conf
        - sed -i "s/Domains=.*$/Domains={{ dns_search_domain }}/" /etc/systemd/resolved.conf
      when: dns_nameserver != ""

    - name: Setup DNS for Ubuntu
      ansible.builtin.shell: |
        [ -f /etc/netplan/01-netcfg.yaml ] && sed -i 's/addresses\(.\) \[.*\]$/addresses\1 \[{{ dns_nameserver }}\]/' /etc/netplan/01-netcfg.yaml || :
      when: ansible_facts['distribution'] == "Ubuntu"

# Swap is not turned off. Since Kubernetes 1.30 kubelet can run on a host
# which has swap enabled, so it is configured to tolerate it without using
# it instead, which leaves the host's own swap alone. See the
# KubeletConfiguration in the kubeadm configuration below.

    # No task above this one needs the network, and nothing has waited for it
    # either: vagrant waits for ssh, which answers on a forwarded port while
    # the guest is still bringing its own network up. So wait here rather than
    # let the first download race the boot. Starting the target is the wait:
    # it pulls in the wait-online service of whichever network manager the
    # distro uses, and returns once the network is configured.
    #
    # Not on a host we were given: that one was up and on the network long
    # before the run reached it, and starting targets on a machine somebody
    # else owns is not ours to do.
    - name: Wait for the network of the VM to be up
      ansible.builtin.systemd:
        name: network-online.target
        state: started
      when: not (is_hardware | default(false) | bool)

    - name: Add Kubernetes APT repository to sources.list.d
      ansible.builtin.copy:
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: '0644'
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Download Kubernetes APT key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Convert the Kubernetes APT key to keyring format
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Clean up temporary key file
      ansible.builtin.file:
        path: /tmp/kubernetes-release.key
        state: absent
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Disable ssh daemon per source penalties
      block:
        - name: Disable ssh daemon per source penalties
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/90-disable-persource-penalties.conf
            content: |
              PerSourcePenalties no
            mode: '0644'
        - name: Restart ssh daemon
          ansible.builtin.systemd:
            name: sshd
            state: restarted
      when: (ansible_facts['distribution'] == "Fedora") and
            (ansible_facts['distribution_major_version'] | int >= 41) and
            (not is_hardware)

    - name: Update APT package index
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: "{{ apt_cache_valid_time }}"
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Add yum repository for Kubernetes
      ansible.builtin.yum_repository:
        description: Kubernetes repository
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key"
        state: present
        name: kubernetes
      when: ansible_facts['distribution'] == "Fedora"

    # Install Helm from a release tarball to /usr/local.
    - name: Install Helm binaries from release tarball
      block:
        - name: Check for cached Helm release tarball
          ansible.builtin.stat:
            path: "{{ cached_helm_tarball }}"
          register: cached_helm
          delegate_to: localhost
          become: false

        - name: Download and cache Helm release tarball
          ansible.builtin.get_url:
            url: "{{ helm_tarball }}"
            dest: "{{ cached_helm_tarball }}"
            mode: '0644'
          when: not cached_helm.stat.exists
          delegate_to: localhost
          become: false

        - name: Install Helm runtime release tarball under /usr/local
          ansible.builtin.unarchive:
            src: "{{ cached_helm_tarball }}"
            dest: /usr/local
            copy: true

        - name: Move Helm binaries to /usr/local/bin from extracted release tarball
          ansible.builtin.shell: "{{ item }}"
          with_items:
            - mv /usr/local/linux-amd64/helm /usr/local/bin
            - rm -fr /usr/local/linux-amd64

    - name: Install ansible.builtin.dnf dependencies
      ansible.builtin.shell: |
        dnf install -y python3-libdnf5
      when: (ansible_facts['distribution'] == "Fedora") and
            (ansible_facts['distribution_major_version'] | int == 41)

    # rsync is what the deploy playbook's synchronize tasks run on the host.
    # A VM image happens to carry it; a host we were given need not.
    - name: Install common packages
      ansible.builtin.package:
        name:
          - curl
          - runc
          - jq
          - python3-pip
          - kubelet
          - kubeadm
          - kubectl
          - systemd-container
          - rsync
        state: present

    - name: Install apt packages
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - gnupg-agent
          - software-properties-common
        state: present
        update_cache: true
        cache_valid_time: "{{ apt_cache_valid_time }}"
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Install rpm packages
      when: ansible_facts['distribution'] == "Fedora"
      block:
        - name: Common rpm packages
          ansible.builtin.dnf:
            pkg:
              - iproute-tc
              - grubby
              - cloud-utils-growpart
              - btrfs-progs
              # chrt, which the tests use to read scheduling flags back.
              - util-linux-core
            state: present
        - name: Extra python3 rpm packages for ansible
          ansible.builtin.dnf:
            pkg:
              - python3-libselinux
              - python3-packaging
            state:
              present
          when: ansible_facts['distribution_major_version'] | int >= 40
        - name: cri-tools for crictl
          ansible.builtin.dnf:
            pkg:
              - cri-tools
            state:
              present
          when: ansible_facts['distribution_major_version'] | int >= 43

    # Not on a host we were given: growing somebody's root partition to fill
    # their disk is not ours to do, and is not undone by anything here.
    - name: Resize root filesystem to the maximum possible
      when: ansible_facts['distribution'] == "Fedora" and
            (not is_hardware)
      ansible.builtin.shell: |
        fstype="$(stat -f -c %T /)"
        if [ "$fstype" == "btrfs" ]; then
            growpart /dev/vda 4
            status=$?
            case $status in
                 0) btrfs filesystem resize max /;;
                 1) ;; # already at max size
                 *) echo "***** WARNING: failed to grow partition";;
            esac
        else
            echo "***** WARNING: Root filesystem type ($fstype) is not btrfs."
            echo "***** WARNING: resize of / to max possible size..."
            sleep 3
        fi

    # Not on a host we were given. This task changes such a host twice: it
    # switches the running mode to permissive at once, and writes
    # SELINUX=disabled for a next boot which this playbook never performs.
    # Neither is ours to do to a machine somebody else owns, and the second
    # takes effect long afterwards with nothing to connect it to a test run.
    # Such a host has to come with SELinux already out of the way, and the
    # tasks at the top of this play refuse it if it does not.
    - name: Disable SELinux
      ansible.posix.selinux:
        state: disabled
      when: ansible_facts['distribution'] == "Fedora" and
            (not is_hardware)

    - name: Remove the firewalld package
      ansible.builtin.package:
        name: firewalld
        state: absent
      when: ansible_facts['distribution'] == "Fedora"

    - name: Install podman for CRI-O runs
      ansible.builtin.dnf:
        pkg:
          - podman
        state: present
      when: ansible_facts['distribution'] == "Fedora" and is_crio

    # Separate from podman, and not for the runtime the host already has: the
    # rpm brings its own binaries, configuration and unit file, so installing
    # it would replace or shadow the CRI-O under test, which is the one thing
    # a release of "installed" promises not to do.
    - name: Install the distro CRI-O
      ansible.builtin.dnf:
        pkg:
          - cri-o
        state: present
      when: ansible_facts['distribution'] == "Fedora" and is_crio and
            (manage_runtime | default(true) | bool)

    # Install containerd or CRI-O from a release tarball to /usr/local.
    - name: Install runtime binaries from release tarball
      block:
        - name: Check for cached runtime release tarball
          ansible.builtin.stat:
            path: "{{ cached_runtime_tarball }}"
          register: cached_runtime
          delegate_to: localhost
          become: false

        - name: Download and cache runtime release tarball
          ansible.builtin.get_url:
            url: "{{ remote_runtime_tarball }}"
            dest: "{{ cached_runtime_tarball }}"
            mode: '0644'
          when: not cached_runtime.stat.exists
          delegate_to: localhost
          become: false

        - name: Install runtime release tarball under /usr/local
          ansible.builtin.unarchive:
            src: "{{ cached_runtime_tarball }}"
            dest: /usr/local
            copy: true

        - name: Install CRI-O binaries from release tarball
          ansible.builtin.shell:
            cmd: ./install
            chdir: /usr/local/cri-o
          when: is_crio
      when: ((is_containerd and containerd_src == "") or
             (is_crio and crio_src == "")) and
            (manage_runtime | default(true) | bool)

    # Install containerd binaries from compiled sources.
    - name: Install containerd binaries from compiled sources
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin"
        mode: '0755'
      with_items:
        - "{{ containerd_src }}/bin/ctr"
        - "{{ containerd_src }}/bin/containerd"
        - "{{ containerd_src }}/bin/containerd-shim-runc-v2"
      when: is_containerd and containerd_src != ""

    # Install CRI-O binaries from compiled sources.
    - name: Install CRI-O binaries from compiled sources
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin"
        mode: '0755'
      with_items:
        - "{{ crio_src }}/bin/crio"
        - "{{ crio_src }}/bin/crio-status"
        - "{{ crio_src }}/bin/pinns"
      when: is_crio and crio_src != ""

    - name: Install CRI-O systemd service file from compiled sources
      ansible.builtin.copy:
        src: "{{ crio_src }}/contrib/crio.service"
        dest: "/etc/systemd/system/crio.service"
        mode: '0644'
      when: is_crio and crio_src != ""

    - name: Configure runc as the default CRI-O runtime
      when: is_crio and (manage_runtime | default(true) | bool)
      block:
        - name: Remove CRI-O crun configuration
          ansible.builtin.file:
            state: absent
            path: /etc/crio/crio.conf.d/10-crun.conf

        - name: Make runc the default CRI-O runtime
          ansible.builtin.copy:
            dest: /etc/crio/crio.conf.d/10-runc.conf
            content: |
              [crio.runtime]
              default_runtime = "runc"
            mode: '0644'

    # Under /etc, not /lib. /etc/systemd/system takes precedence over the
    # package-owned unit instead of overwriting it, so removing this file
    # gives the host its own containerd back. /lib is a symlink to /usr/lib
    # on Fedora, so a unit written there replaced the rpm's copy.
    #
    # force, because get_url downloads nothing when the destination exists,
    # and a unit already at this path can start a containerd other than the
    # one installed under /usr/local above. backup, because on a host
    # somebody owns that unit is theirs; an unchanged file makes neither a
    # download nor a backup.
    - name: Install containerd systemd service file
      ansible.builtin.get_url:
        url: "{{ containerd_service_file }}"
        dest: /etc/systemd/system/containerd.service
        owner: root
        group: root
        mode: '0644'
        force: true
        backup: true
      when: is_containerd and (manage_runtime | default(true) | bool)

    - name: Create service.d directory for the runtime
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ cri_runtime }}.service.d"
        state: directory
        mode: '0755'
      when: (manage_runtime | default(true) | bool)

    - name: Set up proxies for the runtime
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ cri_runtime }}.service.d/proxy.conf"
        content: |
          [Service]
          Environment=HTTP_PROXY="{{ http_proxy }}"
          Environment=HTTPS_PROXY="{{ https_proxy }}"
          Environment=NO_PROXY="{{ no_proxy }}"
        mode: '0644'
      when: (manage_runtime | default(true) | bool)

    # First issue daemon-reload to pick up config changes
    - name: Start runtime
      ansible.builtin.systemd:
        name: "{{ cri_runtime }}"
        daemon_reload: true
        state: started
        enabled: true

    # crictl tries a list of well known endpoints when it is not told one,
    # so on a host with both runtimes installed it can talk to the one this
    # run did not ask for. Written whatever manage_runtime says, since a
    # runtime the host installed itself still has to be named. Only the two
    # endpoint lines are ours; the rest of the file, and whatever those two
    # held, is the host owner's.
    - name: Point crictl at the runtime of this run
      ansible.builtin.lineinfile:
        path: /etc/crictl.yaml
        regexp: '^{{ item }}:'
        line: "{{ item }}: {{ cri_socket }}"
        create: true
        mode: '0644'
        backup: true
      loop:
        - runtime-endpoint
        - image-endpoint

    - name: Configure containerd
      when: is_containerd and (manage_runtime | default(true) | bool)
      block:
        - name: Create drop-in directory (/etc/containerd/conf.d)
          ansible.builtin.file:
            path: /etc/containerd/conf.d
            state: directory

        - name: Generate default configuration (/etc/containerd/config.toml)
          ansible.builtin.shell: containerd config default > /etc/containerd/config.toml

        - name: Enable drop-in directory in configuration
          ansible.builtin.lineinfile:
            path: /etc/containerd/config.toml
            regexp: '^imports *=.*'
            line: 'imports = [ "/etc/containerd/conf.d/*.toml" ]'
            state: present

        - name: Enable all plugins
          ansible.builtin.lineinfile:
            path: /etc/containerd/config.toml
            regexp: '^disabled_plugins *=.*'
            line: 'disabled_plugins = []'
            state: present

        - name: Enable systemd cgroup driver
          ansible.builtin.copy:
            dest: /etc/containerd/conf.d/systemd-cgroup.toml
            content: |
              [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
              SystemdCgroup = true

        - name: Update CNI plugin directory on Fedora
          when: ansible_facts['distribution'] == "Fedora"
          ansible.builtin.replace:
            path: /etc/containerd/config.toml
            regexp: '/opt/cni/bin'
            replace: '/usr/libexec/cni'

    - name: Configure bridge CNI plugin
      when: cni_plugin == "bridge"
      block:
        - name: Copy CNI bridge plugin configuration
          ansible.builtin.copy:
            src: "{{ nri_resource_policy_src }}/test/e2e/files/10-bridge.conf.in"
            dest: "/etc/cni/net.d/10-bridge.conf"
            owner: root
            group: root
            mode: '0644'

        - name: Update CNI bridge plugin configuration
          ansible.builtin.replace:
            path: /etc/cni/net.d/10-bridge.conf
            regexp: '(CNI_NETWORK)'
            replace: "{{ network }}"

    - name: Restart the containerd
      ansible.builtin.systemd:
        state: restarted
        name: "{{ cri_runtime }}"
        daemon_reload: true
      when: is_containerd and (manage_runtime | default(true) | bool)

    - name: Restart CRI-O
      ansible.builtin.systemd:
        state: restarted
        name: "{{ cri_runtime }}"
        daemon_reload: true
      when: is_crio and (manage_runtime | default(true) | bool)

    - name: Load modules the k8s cluster needs
      block:
        - name: Add modules for k8s cluster
          ansible.builtin.copy:
            dest: /etc/modules-load.d/nri-plugins-e2e-k8s.conf
            content: |
              bridge
              br_netfilter
            mode: '0644'
            backup: true

        - name: Load modules for k8s cluster
          ansible.builtin.shell: systemctl restart systemd-modules-load

    - name: Set sysctl settings the k8s cluster needs
      block:
        - name: Add sysctl settings for k8s cluster
          ansible.builtin.copy:
            dest: /etc/sysctl.d/60-nri-plugins-e2e-k8s.conf
            content: |
              net.bridge.bridge-nf-call-ip6tables = 1
              net.bridge.bridge-nf-call-iptables = 1
              net.ipv4.ip_forward = 1
            mode: '0644'
            backup: true

        - name: Disable rp_filter for cilium
          ansible.builtin.copy:
            dest: /etc/sysctl.d/90-nri-plugins-e2e-cilium.conf
            content: |
              net.ipv4.conf.*.rp_filter = 0
            mode: '0644'
          when: cni_plugin == "cilium"

        - name: Restore rp_filter when cilium is not used
          ansible.builtin.file:
            path: /etc/sysctl.d/90-nri-plugins-e2e-cilium.conf
            state: absent
          when: cni_plugin != "cilium"

        - name: Apply sysctl settings
          ansible.builtin.shell: sysctl --system || true
          changed_when: false

    - name: Restart kubelet
      ansible.builtin.service:
        name: kubelet
        daemon_reload: true
        state: restarted

    - name: Write the kubeadm configuration
      ansible.builtin.copy:
        dest: /root/kubeadm-config.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          nodeRegistration:
            name: "{{ hostname }}"
            criSocket: "{{ cri_socket }}"
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          networking:
            podSubnet: "{{ network }}"
          {% if k8s_feature_gates != "" %}
          apiServer:
            extraArgs:
              - name: feature-gates
                value: "{{ k8s_feature_gates }}"
          scheduler:
            extraArgs:
              - name: feature-gates
                value: "{{ k8s_feature_gates }}"
          {% endif %}
          ---
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          failSwapOn: false
          memorySwap:
            swapBehavior: NoSwap
          {% if k8s_feature_gates != "" %}
          featureGates:
          {% for gate in k8s_feature_gates.split(',') if '=' in gate %}
            {{ gate.split('=')[0] | trim }}: {{ gate.split('=')[1] | trim }}
          {% endfor %}
          {% endif %}

    # Always from the configuration file, so that the node name and the
    # kubelet settings have one home. Left to itself kubeadm would name the
    # node after the host's own hostname, which on a real host is the fqdn,
    # while the framework looks the node up by the short name it was given.
    #
    # The CRI socket is named for the same reason: a host we were given can
    # have both runtimes installed, and kubeadm refuses to pick between two
    # endpoints although the run has already picked one.
    - name: Initialize the Kubernetes cluster using kubeadm
      ansible.builtin.command:
        cmd: kubeadm init --config /root/kubeadm-config.yaml

    # --backup, not -i: kubeadm init wrote a new admin.conf a moment ago, so
    # any kubeconfig already in place is stale, and on a host we were given it
    # can name a cluster of its own. -i would prompt, read the end of
    # ansible's empty stdin as a no, and leave that one in place for every
    # kubectl below and in the tests to talk to the wrong cluster through. The
    # copy it leaves behind is for whoever owns the host, and is numbered so
    # that repeated runs do not overwrite the first one taken.
    - name: Setup kubeconfig for the login user
      ansible.builtin.command: "{{ item }}"
      # The home directory is quoted in each: these run without a shell, and
      # ansible splits the string, so a passwd home with a space in it would
      # otherwise arrive as two arguments.
      with_items:
        - mkdir -p "{{ login_user_home }}/.kube"
        - cp --backup=numbered /etc/kubernetes/admin.conf "{{ login_user_home }}/.kube/config"
        # Trailing colon: the user's own login group, whatever it is called.
        # A group named after the user is a convention, not a rule. The item
        # is quoted too, or the ": " in it makes yaml read it as a mapping.
        - 'chown {{ login_user }}: "{{ login_user_home }}/.kube/config"'

    # Skipped when the login user is root, which already has its kubeconfig
    # from the task above: a second copy would only push the config that one
    # wrote into a backup of its own.
    - name: Setup kubeconfig for root
      when: login_user_home != "/root"
      ansible.builtin.command: "{{ item }}"
      with_items:
        - mkdir -p /root/.kube
        - cp --backup=numbered /etc/kubernetes/admin.conf /root/.kube/config

    - name: Install single-node cluster
      become: false
      ansible.builtin.shell: "{{ item }}"
      with_items:
        - kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
        - kubectl taint nodes --all node-role.kubernetes.io/master- || true

    - name: Install cilium CNI plugin
      when: cni_plugin == "cilium"
      block:
        - name: "Use irregular download path if cilium release is latest"
          when: cni_release == "latest"
          ansible.builtin.set_fact:
            cilium_tarball: https://github.com/cilium/cilium-cli/releases/latest/download/cilium-linux-amd64.tar.gz

        - name: "Use regular download path if cilium release is not latest"
          when: cni_release != "latest"
          ansible.builtin.set_fact:
            cilium_tarball: https://github.com/cilium/cilium-cli/releases/download/{{ cni_release }}/cilium-linux-amd64.tar.gz

        - name: "Fetch and extract {{ cni_release }} cilium (installer) release tarball"
          ansible.builtin.unarchive:
            src: "{{ cilium_tarball }}"
            dest: /usr/local/bin
            remote_src: true

        - name: Run cilium installer
          ansible.builtin.command: "{{ item }}"
          with_items:
            - cilium install --wait
            - cilium status --wait

    - name: Generate join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command

    - name: Copy join command to local file
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: "{{ join_command.stdout_lines[0] }}"
        dest: "{{ outdir }}/join-command"
        mode: '0644'

    - name: Enable kubelet systemd service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
